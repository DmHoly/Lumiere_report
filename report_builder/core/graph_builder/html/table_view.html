<div id="table-view" style="display:none;flex:1;height:100%;min-height:0;flex-direction:column;background:var(--bg);">

  <!-- Table toolbar -->
  <div style="
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;">

    <!-- Search -->
    <input id="tbl-search" placeholder="🔍 Rechercher…" oninput="tblFilter()"
      style="font-family:var(--fm);font-size:11px;padding:5px 10px;border:1px solid var(--border);
      border-radius:var(--radius);width:200px;outline:none;transition:border-color .15s;"
      onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border)'">

    <div style="width:1px;height:20px;background:var(--border);"></div>

    <!-- Computed column -->
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-family:var(--fm);font-size:9px;color:var(--slate-400);text-transform:uppercase;letter-spacing:.06em;">Nouvelle colonne</span>
      <input id="tbl-newcol-name" placeholder="nom" style="
        font-family:var(--fm);font-size:10px;padding:4px 8px;width:90px;
        border:1px solid var(--border);border-radius:var(--radius);outline:none;">
      <span style="font-family:var(--fm);font-size:10px;color:var(--slate-400);">=</span>
      <input id="tbl-newcol-expr" placeholder="ex: max_EQE * V_at_MaxEQE  ou  Math.log(max_EQE)" style="
        font-family:var(--fm);font-size:10px;padding:4px 8px;width:280px;
        border:1px solid var(--border);border-radius:var(--radius);outline:none;">
      <button onclick="tblAddCol()" style="
        font-family:var(--fm);font-size:9px;padding:5px 12px;
        background:var(--navy);color:white;border:none;border-radius:var(--radius);
        cursor:pointer;letter-spacing:.04em;">+ Ajouter</button>
      <span id="tbl-col-err" style="font-family:var(--fm);font-size:9px;color:#EF4444;"></span>
    </div>

    <div style="width:1px;height:20px;background:var(--border);"></div>

    <!-- Restore excluded -->
    <button onclick="tblRestoreAll()" style="
      font-family:var(--fm);font-size:9px;padding:5px 10px;
      border:1px solid var(--border);background:var(--slate-100);
      border-radius:var(--radius);cursor:pointer;color:var(--slate-400);transition:all .15s;"
      onmouseover="this.style.borderColor='var(--navy)';this.style.color='var(--navy)'"
      onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--slate-400)'">
      ↺ Restaurer tout
    </button>

    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
      <span id="tbl-info" style="font-family:var(--fm);font-size:9px;color:var(--slate-400);"></span>
      <button onclick="tblExport('csv')" style="
        font-family:var(--fm);font-size:9px;padding:5px 12px;
        border:1px solid var(--gold);background:rgba(212,175,55,.1);
        border-radius:var(--radius);cursor:pointer;color:var(--navy);transition:all .15s;"
        onmouseover="this.style.background='var(--gold)'"
        onmouseout="this.style.background='rgba(212,175,55,.1)'">⬇ CSV</button>
      <button onclick="tblExport('json')" style="
        font-family:var(--fm);font-size:9px;padding:5px 12px;
        border:1px solid var(--border);background:var(--slate-100);
        border-radius:var(--radius);cursor:pointer;color:var(--slate-400);transition:all .15s;"
        onmouseover="this.style.borderColor='var(--navy)';this.style.color='var(--navy)'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--slate-400)'">⬇ JSON</button>
    </div>
  </div>

  <!-- Table container -->
  <div style="flex:1;overflow:auto;min-height:0;">
    <table id="tbl-main" style="
      width:100%;border-collapse:collapse;font-family:var(--fm);font-size:11px;">
      <thead id="tbl-head" style="position:sticky;top:0;z-index:10;"></thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>

  <!-- Bottom bar -->
  <div style="
    padding:6px 16px;background:var(--surface);border-top:1px solid var(--border);
    font-family:var(--fm);font-size:9px;color:var(--slate-400);
    display:flex;align-items:center;gap:16px;flex-shrink:0;">
    <span id="tbl-status">—</span>
    <span style="color:var(--gold);" id="tbl-excluded-info"></span>
    <span style="margin-left:auto;">ℹ Les lignes exclues sont retirées de tous les graphiques</span>
  </div>
</div>
