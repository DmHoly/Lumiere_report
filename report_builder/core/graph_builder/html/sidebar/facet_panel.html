  <div id="panel-facet" style="display:none">

        Configuration Facet

      </div>

        <div class="gb-row">

        </div>
        <div class="gb-row">

          <div class="gb-select-wrap"><select class="gb-select" id="f-y"></select></div>
        </div>
        <div class="gb-row">
          <label class="gb-label">Colonnes (col_wrap) <span class="gb-badge gb-badge-c">catégoriel</span></label>
          <div class="gb-select-wrap"><select class="gb-select" id="f-col"><option value="">— aucune —</option></select></div>
        </div>
        <div class="gb-row">
          <label class="gb-label">Lignes (row_wrap) <span class="gb-badge gb-badge-c">catégoriel</span></label>
          <div class="gb-select-wrap"><select class="gb-select" id="f-row"><option value="">— aucune —</option></select></div>
        </div>
        <div class="gb-row">
          <label class="gb-label">Couleur <span class="gb-badge gb-badge-c">catégoriel</span></label>
          <div class="gb-select-wrap"><select class="gb-select" id="f-c"><option value="">— auto —</option></select></div>
        </div>
        <div class="gb-row">

          <div class="gb-chart-grid" style="grid-template-columns:repeat(4,1fr)">

            </div>
            <div class="gb-ctype" data-ftype="histogram" onclick="setFacetType(this)">

            <div class="gb-ctype" data-ftype="violin" onclick="setFacetType(this)">

            </div>
          </div>

        <div class="gb-toggle-row">

        <div class="gb-toggle-row">
          <span class="gb-toggle-lbl">Axes partagés (shared Y)</span>
          <button class="gb-toggle on" id="tog-fshy" onclick="this.classList.toggle('on')"></button>

        </div>
      </div>
    </div>
  </div><!-- /panel-facet -->
